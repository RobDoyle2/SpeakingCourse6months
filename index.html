<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Communication Programme</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--sf:#fff;--tx:#1d2420;--mu:#6a746d;--ln:#dcdad2;--ac:#0f766e;--ac2:#ccefe9;--ok:#dff3e4;--okt:#1e7a3c;--wk:#efede7;--sh:0 10px 40px rgba(0,0,0,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--sf:#1d2220;--tx:#e8ece9;--mu:#9aa59d;--ln:#333a36;--ac:#4fd1c0;--ac2:#18403b;--ok:#1b3324;--okt:#6fd48f;--wk:#191d1b;--sh:0 10px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:1.25rem;margin:0;min-width:11ch}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button,.pill{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:5px 12px}
.nav button:disabled{opacity:.35;cursor:default}
#mt{min-width:9.5ch;text-align:center;font-weight:600}
#prog{color:var(--mu);font-size:.85rem}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 0 4px;color:var(--mu);font-size:.8rem;text-align:center}
#grid{flex:1;min-height:300px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.c{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0;overflow:hidden}
.c.x{visibility:hidden}.c.o{opacity:.4}
button.c:hover{border-color:var(--ac)}
.c.wk{background:var(--wk)}
.c .n{font-weight:600;font-size:.95rem;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%}
.c .l{font-size:.72rem;color:var(--ac);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.c .t{font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c .r{font-size:.72rem;color:var(--mu);font-style:italic}
.c.today{border:2px solid var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.c.today .n{background:var(--ac);color:var(--bg)}
.c.done{background:var(--ok)}.c.done .l{color:var(--okt)}
.c.done::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--okt);font-weight:700}
.c.note::before{content:"";position:absolute;bottom:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--ac);width:var(--p,0)}
footer{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;font-size:.88rem;border-top:1px solid var(--ln);margin-top:8px;position:relative}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-weight:600;margin-right:2px}
footer .pill{font-size:.85rem;padding:3px 10px}
.pill:hover{border-color:var(--ac)}
.right{margin-left:auto}
details.more>summary{list-style:none;cursor:pointer}details.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;bottom:100%;right:12px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:250px;z-index:5}
.menu button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:6px}.menu button:hover{background:var(--ac2)}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);box-shadow:var(--sh);z-index:11;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:in .18s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
[hidden]{display:none!important}
.ph{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--ln)}
.ph .s{color:var(--ac);font-weight:600;font-size:.85rem}.ph h2{margin:2px 0;font-size:1.3rem;line-height:1.25}.ph .m{color:var(--mu);font-size:.82rem}
.ph>button{margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px;width:36px;height:36px;flex:none}
.pb{flex:1;overflow:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.prg{color:var(--mu);font-size:.9rem;margin-bottom:10px}
.intro{background:var(--ac2);border-radius:10px;padding:2px 14px;margin-bottom:12px}
.tk{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.tk>header{padding:10px 12px;gap:8px;flex-wrap:nowrap;cursor:pointer}
.tk .tt{font-weight:600;flex:1}.tk .tm{color:var(--mu);font-size:.8rem}
.tk .ck{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:999px;padding:3px 12px;font-size:.85rem;white-space:nowrap}
.tk.done .ck{background:var(--ac);color:var(--bg)}
.tk .tb{padding:0 14px 6px;display:none}.tk.open .tb{display:block}
.tk.done{opacity:.75}
.tk .cv{transition:transform .15s;color:var(--mu)}.tk.open .cv{transform:rotate(180deg)}
.pb p{margin:.5em 0}.pb ul,.pb ol{margin:.4em 0;padding-left:1.4em}.pb li{margin:.15em 0}
.pb h4{margin:1em 0 .2em;color:var(--ac);font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.pb blockquote{margin:.6em 0;padding:.2em 12px;border-left:3px solid var(--ac);color:var(--mu);font-style:italic}
p.ind{margin-left:1em;padding-left:10px;border-left:2px solid var(--ln)}
.tw{overflow-x:auto}table{border-collapse:collapse;margin:.6em 0;font-size:.9rem}td,th{border:1px solid var(--ln);padding:4px 10px;text-align:left}th{background:var(--ac2)}
details.gd{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 14px;margin:12px 0}details.gd summary{cursor:pointer;font-weight:600}
.nt{margin-top:16px}.nt label{font-weight:600;display:block;margin-bottom:4px}
.nt textarea{width:100%;min-height:130px;resize:vertical;font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.nt small{color:var(--mu)}
@media(max-width:640px){#grid,.dow{gap:3px}.c{padding:3px 4px;border-radius:7px}.c .t,.c .r{display:none}.c .n{font-size:.8rem}header h1{font-size:1.05rem}.c.done::after{top:3px;right:4px;font-size:.8rem}}
</style>
</head>
<body>
<header>
  <h1>Communication Programme</h1>
  <span id="prog"></span>
  <div class="nav"><button id="pv" aria-label="Previous month">‹</button><span id="mt"></span><button id="nx" aria-label="Next month">›</button><button id="td">Today</button></div>
</header>
<main>
  <div class="dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  <div id="grid"></div>
</main>
<footer>

    <label class="pill" style="cursor:pointer">Restore<input type="file" id="im" accept=".json" hidden></label>
  </div>
</footer>
<div id="bk" hidden></div>
<aside id="panel" hidden role="dialog" aria-modal="true"></aside>

ce three ways."}]},{"title":"Skill","mins":"3 min","blocks":[{"t":"p","x":"Experiment with:"},{"t":"li","x":"pace;"},{"t":"li","x":"emphasis;"},{"t":"li","x":"energy."}]},{"title":"Drill","mins":"5 min","blocks":[{"t":"p","x":"Say:"},{"t":"p","x":"“I don't think that's going to work.”"},{"t":"p","x":"As:"},{"t":"li","x":"uncertain;"},{"t":"li","x":"concerned;"},{"t":"li","x":"firm;"},{"t":"li","x":"amused;"},{"t":"li","x":"reassuring."}]},{"title":"Application","mins":"3 min","blocks":[{"t":"p","x":"Give a one-minute explanation."}]},{"title":"Review","mins":"2 min","blocks":[{"t":"p","x":"Did I sound engaged?"}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":2,"weekName":"Emphasis and vocal clarity","weekIntro":[],"g":2},{"date":"2026-10-16","kind":"day","n":10,"label":"Day 10","title":"Short Story","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read aloud."}]},{"title":"Skill","mins":"3 min","blocks":[{"t":"p","x":"Use:"},{"t":"p","x":"Something happened → Reaction → Point"}]},{"title":"Drill","mins":"5 min","blocks":[{"t":"p","x":"Tell three 30-second stories."}]},{"title":"Application","mins":"3 min","blocks":[{"t":"p","x":"Tell one two-minute story."}]},{"title":"Review","mins":"2 min","blocks":[{"t":"p","x":"What was the most interesting moment?"}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":2,"weekName":"Emphasis and vocal clarity","weekIntro":[],"g":2},{"date":"2026-10-19","kind":"day","n":11,"label":"Day 11","title":"Answer First","intro":[{"t":"p","x":"Today's goal: Give the listener your main point before explaining the background."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read these opening phrases aloud three times:"},{"t":"li","x":"“The short answer is…”"},{"t":"li","x":"“My main point is…”"},{"t":"li","x":"“I would recommend…”"},{"t":"li","x":"“The biggest issue is…”"},{"t":"li","x":"“I think we should…”"},{"t":"p","x":"After each phrase, complete the sentence with a simple idea."},{"t":"p","x":"For example: “The biggest issue is that we don't have enough time.”"}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"When someone asks you a question, you may start explaining the background while you work out your answer. The listener then has to wait for the point."},{"t":"p","x":"Instead, give the answer first. Add the explanation afterwards."},{"t":"p","x":"Use this structure:"},{"t":"p","x":"Answer → Reason → Example"},{"t":"p","x":"For example:"},{"t":"p","x":"Question: “Do you think we should change the project plan?”"},{"t":"p","x":"Answer: “Yes, I think we should.”"},{"t":"p","x":"Reason: “The current plan leaves too little time for testing.”"},{"t":"p","x":"Example: “Last time, we found several problems during the final week.”"},{"t":"p","x":"You don't need all three parts every time. Use only what helps the listener."}]},{"title":"Speaking drill","mins":"5 min","blocks":[{"t":"p","x":"Answer these five questions. Allow about 30–40 seconds for each."},{"t":"ol","n":1,"x":"What makes a good manager?"},{"t":"ol","n":2,"x":"What is the most important part of your job?"},{"t":"ol","n":3,"x":"What makes a conversation enjoyable?"},{"t":"ol","n":4,"x":"What is something you would like to learn?"},{"t":"ol","n":5,"x":"What makes someone a good friend?"},{"t":"p","x":"For every answer:"},{"t":"ol","n":1,"x":"Start with “The short answer is…” or “I think…”"},{"t":"ol","n":2,"x":"State your answer in the first sentence."},{"t":"ol","n":3,"x":"Give one reason."},{"t":"ol","n":4,"x":"Stop when you've made your point."},{"t":"p","x":"Don't restart an answer because the wording wasn't perfect."}]},{"title":"Real-life application","mins":"5 min","blocks":[{"t":"p","x":"Think of a question you might realistically be asked at work this week."},{"t":"p","x":"For example:"},{"t":"li","x":"“What's the current status?”"},{"t":"li","x":"“What's the problem?”"},{"t":"li","x":"“What do you recommend?”"},{"t":"li","x":"“Do we need to change the plan?”"},{"t":"p","x":"Answer it aloud twice."},{"t":"p","x":"First attempt: Answer naturally."},{"t":"p","x":"Second attempt: Give the answer in your first sentence, then explain."},{"t":"p","x":"If you have time, record the second attempt and listen back. Could someone understand your position within the first five seconds?"}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I answer before explaining?"},{"t":"li","x":"Did I add unnecessary background?"},{"t":"li","x":"Did the answer sound more confident when I led with the point?"},{"t":"p","x":"Today's takeaway: Write one sentence describing what you want to remember."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In one conversation today, give your answer before explaining your reasoning."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-20","kind":"day","n":12,"label":"Day 12","title":"Five-Second Start","intro":[{"t":"p","x":"Today's goal: Begin speaking without waiting for the perfect opening."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a familiar subject, such as your weekend, your work or a hobby."},{"t":"p","x":"Speak about it for 30 seconds."},{"t":"p","x":"Don't prepare notes. Just start."},{"t":"p","x":"Now choose another subject and begin within five seconds."},{"t":"p","x":"Notice the difference between preparing endlessly and simply getting started."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Sometimes the difficulty isn't knowing what to say. It's finding the first sentence."},{"t":"p","x":"You may try to construct the entire answer in your head before opening your mouth. That creates pressure and can make spontaneous speaking harder."},{"t":"p","x":"Today, practise starting with a simple, useful sentence. You can develop the thought after you begin."},{"t":"p","x":"Use one of these openings:"},{"t":"li","x":"“My first thought is…”"},{"t":"li","x":"“I think the main issue is…”"},{"t":"li","x":"“One example that comes to mind is…”"},{"t":"li","x":"“The way I see it…”"},{"t":"li","x":"“Something I've noticed is…”"},{"t":"p","x":"These are starting points, not phrases you must use every time."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Complete five rounds."},{"t":"p","x":"For each round:"},{"t":"ol","n":1,"x":"Read the question."},{"t":"ol","n":2,"x":"Give yourself no more than five seconds."},{"t":"ol","n":3,"x":"Start speaking."},{"t":"ol","n":4,"x":"Continue for approximately 40–45 seconds."},{"t":"ol","n":5,"x":"Pause briefly before the next round."},{"t":"p","x":"Questions:"},{"t":"ol","n":1,"x":"What makes a workplace enjoyable?"},{"t":"ol","n":2,"x":"What is something you have learned from experience?"},{"t":"ol","n":3,"x":"What makes a person interesting?"},{"t":"ol","n":4,"x":"What would you change about how meetings are run?"},{"t":"ol","n":5,"x":"What is something you enjoy doing outdoors?"},{"t":"p","x":"After the five rounds, choose one question and answer it again for 60 seconds."},{"t":"p","x":"Don't aim for a brilliant answer. Aim for a clear beginning and a complete thought."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Imagine that a colleague asks you unexpectedly:"},{"t":"q","x":"“What do you think we should do about this?”"},{"t":"p","x":"Choose a real or imaginary work issue."},{"t":"p","x":"Give yourself five seconds, then respond for one minute."},{"t":"p","x":"Repeat the exercise with a social question:"},{"t":"q","x":"“What have you been up to lately?”"},{"t":"p","x":"Practise giving a straightforward answer that includes one interesting detail."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I wait for a perfect opening?"},{"t":"li","x":"Did the first sentence become easier after a few rounds?"},{"t":"li","x":"Did I discover that I could develop the thought once I started?"},{"t":"p","x":"Today's takeaway: “I can start simply and develop the answer as I speak.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"When someone asks for your opinion today, try to begin within five seconds rather than mentally rehearsing a complete response."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-21","kind":"day","n":13,"label":"Day 13","title":"Finding Words and Recovering Smoothly","intro":[{"t":"p","x":"Today's goal: Keep communicating when the words don't come easily."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose an everyday object near you."},{"t":"p","x":"Describe it without naming it."},{"t":"p","x":"For example, if the object is a mug:"},{"t":"q","x":"“It's something you drink from. It usually has a handle. You might use it for coffee or tea.”"},{"t":"p","x":"Repeat with two other objects."},{"t":"p","x":"This trains you to explain an idea even when the exact word isn't immediately available."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Good communicators don't always find the perfect word immediately. They know how to recover and continue."},{"t":"p","x":"If you get stuck, don't panic or abandon the sentence. Try one of these phrases:"},{"t":"li","x":"“What I mean is…”"},{"t":"li","x":"“Let me put that more simply.”"},{"t":"li","x":"“The point I'm getting at is…”"},{"t":"li","x":"“Another way to explain it is…”"},{"t":"li","x":"“Let me start that thought again.”"},{"t":"p","x":"Use these phrases naturally. You don't need to apologise for every hesitation."},{"t":"p","x":"The objective is to recover without losing the main point."}]},{"title":"Speaking drill","mins":"5–6 min","blocks":[{"t":"p","x":"Exercise A — Explain another way"},{"t":"p","x":"Complete these five examples aloud:"},{"t":"ol","n":1,"x":"“The project is difficult because…” Explain the same problem in a simpler way."},{"t":"ol","n":2,"x":"“The main risk is…” Give a concrete example."},{"t":"ol","n":3,"x":"“What I'm trying to say is…” Finish the thought in plain English."},{"t":"ol","n":4,"x":"“Another way to look at it is…” Offer a different perspective."},{"t":"ol","n":5,"x":"“Let me put that more simply…” Explain a technical concept to a nontechnical person."},{"t":"p","x":"Allow about 45 seconds per example."},{"t":"p","x":"Exercise B — Recover"},{"t":"p","x":"Choose two of the examples."},{"t":"p","x":"Halfway through each answer, deliberately pause and say:"},{"t":"q","x":"“Let me put that another way.”"},{"t":"p","x":"Then continue with a simpler explanation."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Choose a topic you know well."},{"t":"p","x":"Explain it for one minute without notes."},{"t":"p","x":"If you get stuck:"},{"t":"ol","n":1,"x":"Pause."},{"t":"ol","n":2,"x":"Identify the point you were trying to make."},{"t":"ol","n":3,"x":"Use a recovery phrase."},{"t":"ol","n":4,"x":"Continue."},{"t":"p","x":"Repeat the explanation once, aiming to make it clearer rather than more elaborate."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"What do I normally do when I cannot find a word?"},{"t":"li","x":"Did I recover rather than ramble?"},{"t":"li","x":"Which recovery phrase felt most natural?"},{"t":"p","x":"Today's takeaway: “I don't need the perfect word to keep communicating.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If you lose a word or stumble over a sentence today, pause and explain the idea another way instead of rushing to rescue the original sentence."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-22","kind":"day","n":14,"label":"Day 14","title":"Three Levels: 20 Seconds, 60 Seconds, 2 Minutes","intro":[{"t":"p","x":"Today's goal: Control how much you say without losing the main point."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a familiar subject, such as your job, a hobby or a recent event."},{"t":"p","x":"Explain it in one sentence."},{"t":"p","x":"Now explain it in three sentences."},{"t":"p","x":"Notice how you can communicate the same basic idea at different levels of detail."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"A good communicator doesn't give the same-length answer to every question."},{"t":"p","x":"Sometimes the listener needs a quick answer. Sometimes they want an explanation. Sometimes they need the full picture."},{"t":"p","x":"Your job is to choose the appropriate level of detail."},{"t":"p","x":"Think of three versions:"},{"t":"li","x":"20 seconds: The headline and essential point."},{"t":"li","x":"60 seconds: The point plus the reason and one example."},{"t":"li","x":"2 minutes: A fuller explanation, including relevant context and consequences."},{"t":"p","x":"The longer version should add useful detail, not simply repeat the same idea in more words."}]},{"title":"Speaking drill","mins":"6–7 min","blocks":[{"t":"p","x":"Choose one subject. Good options include:"},{"t":"li","x":"What you do in your job."},{"t":"li","x":"A project you're working on."},{"t":"li","x":"A hobby you enjoy."},{"t":"li","x":"A place you've visited."},{"t":"li","x":"Something you believe makes life better."},{"t":"p","x":"Explain the same subject at all three lengths."},{"t":"p","x":"Round 1 — 20 seconds"},{"t":"p","x":"Give only the essential message."},{"t":"p","x":"Round 2 — 60 seconds"},{"t":"p","x":"Add the main reason and an example."}]},{"title":"Round 3","mins":"2 min","blocks":[{"t":"p","x":"Develop the explanation with relevant background, a specific detail and a conclusion."},{"t":"p","x":"If you finish before the time is up, don't add filler. Finish naturally and use the remaining time to prepare the next version."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Choose a current work topic."},{"t":"p","x":"Imagine three listeners:"},{"t":"ol","n":1,"x":"A busy senior manager."},{"t":"ol","n":2,"x":"A colleague who needs to understand the issue."},{"t":"ol","n":3,"x":"Someone who needs the full explanation to make a decision."},{"t":"p","x":"Give each version aloud."},{"t":"p","x":"For the senior manager, lead with the outcome or decision."},{"t":"p","x":"For the colleague, explain the reasoning."},{"t":"p","x":"For the person making the decision, include the relevant detail and consequences."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"What detail did I remove from the 20-second version?"},{"t":"li","x":"What did I add to the two-minute version?"},{"t":"li","x":"Did the main point remain the same?"},{"t":"li","x":"Did I add detail because it was useful or simply because I had more to say?"},{"t":"p","x":"Today's takeaway: “I can change the length without losing the message.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Before explaining something at work, consider how much detail the listener actually needs. Start with the short version and expand if necessary."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-23","kind":"day","n":15,"label":"Day 15","title":"Answer the Actual Question","intro":[{"t":"p","x":"Today's goal: Listen to the question, identify what is being asked, and answer that question directly."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read these questions aloud:"},{"t":"li","x":"“What happened?”"},{"t":"li","x":"“Why did it happen?”"},{"t":"li","x":"“What should we do?”"},{"t":"li","x":"“When will it be finished?”"},{"t":"li","x":"“What do you recommend?”"},{"t":"p","x":"Give a one-sentence answer to each."},{"t":"p","x":"Notice that each question asks for something different."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Sometimes a question contains background, several details or an expression of concern. It's easy to respond to the general topic rather than the actual question."},{"t":"p","x":"Before answering, silently ask:"},{"t":"q","x":"“What are they actually asking me?”"},{"t":"p","x":"Identify whether they want:"},{"t":"li","x":"A fact."},{"t":"li","x":"An explanation."},{"t":"li","x":"A recommendation."},{"t":"li","x":"A decision."},{"t":"li","x":"Reassurance."},{"t":"li","x":"A next step."},{"t":"p","x":"Answer that first. Add supporting detail only when it helps."},{"t":"p","x":"For example:"},{"t":"p","x":"Question: “Given the testing delays and the supplier issue, do you think we can still deliver by Friday?”"},{"t":"p","x":"Less direct answer: “Well, we've had a few problems with testing, and the supplier has been slow…”"},{"t":"p","x":"More direct answer: “Friday is possible, but it's at risk because of the supplier delay.”"},{"t":"p","x":"Now the listener knows your position. You can explain the details afterwards."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer these five questions."},{"t":"p","x":"Before each answer, pause for two seconds and silently identify the actual question."},{"t":"p","x":"Question 1: “What is the biggest risk to the project?”"},{"t":"p","x":"Answer with the main risk."},{"t":"p","x":"Question 2: “Why has the work fallen behind?”"},{"t":"p","x":"Give the cause, not a full history of the project."},{"t":"p","x":"Question 3: “What would you recommend?”"},{"t":"p","x":"Give your recommendation first."},{"t":"p","x":"Question 4: “Can you finish this by Friday?”"},{"t":"p","x":"Give a clear yes, no or qualified answer."},{"t":"p","x":"Question 5: “What do you need from me?”"},{"t":"p","x":"State the specific help or decision required."},{"t":"p","x":"Allow about 45–60 seconds for each, including a brief pause before answering."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Think of a recent meeting or conversation in which you explained a lot but may not have answered the question directly."},{"t":"p","x":"Reconstruct the exchange."},{"t":"p","x":"Ask yourself:"},{"t":"ol","n":1,"x":"What did the person actually want to know?"},{"t":"ol","n":2,"x":"What did I answer instead?"},{"t":"ol","n":3,"x":"What would a direct first sentence have sounded like?"},{"t":"p","x":"Now role-play the exchange aloud."},{"t":"p","x":"Give the direct answer first, followed by one reason or example if necessary."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I identify the question before answering?"},{"t":"li","x":"Did I answer directly in my first sentence?"},{"t":"li","x":"Did I confuse explaining the background with answering the question?"},{"t":"li","x":"What will I do differently next time?"},{"t":"p","x":"Today's takeaway: “Answer the question first. Explain only what is needed.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In a meeting today, answer the question that was asked — not the question you prepared for."},{"t":"p","x":"If the question is unclear, ask:"},{"t":"q","x":"“Do you mean the current status, or whether I think we'll meet the deadline?”"},{"t":"p","x":"Clarifying the question is better than giving a long answer to the wrong one."}]},{"title":"Week 3 — End-of-week review","mins":null,"blocks":[{"t":"p","x":"Allow 5 minutes on Friday if you have time, or use this as a brief reflection after the daily session."},{"t":"p","x":"Look back at the five skills:"},{"t":"li","x":"Answer First."},{"t":"li","x":"Five-Second Start."},{"t":"li","x":"Finding Words."},{"t":"li","x":"Three Levels."},{"t":"li","x":"Answer the Actual Question."},{"t":"p","x":"Complete these sentences:"},{"t":"p","x":"The skill that came most naturally was…"},{"t":"p","x":"The skill I found most difficult was…"},{"t":"p","x":"One thing I noticed about how I speak is…"},{"t":"p","x":"One thing I will practise in real conversations next week is…"},{"t":"p","x":"This week's key lesson"},{"t":"p","x":"You don't need to think of the whole answer before you start speaking."},{"t":"p","x":"You need to know your first point, begin simply, and develop the thought in manageable pieces."},{"t":"q","x":"Start with the point. Keep going one thought at a time. Recover when needed. Stop when you've answered."},{"t":"p","x":"That' t starting point because Goodman begins with getting your thoughts clear before worrying about delivery."},{"t":"p","x":"That fits your own problem particularly well: sometimes you have a good idea but formulate too much of it before speaking."},{"t":"h","x":"Listen for"},{"t":"li","x":"What exactly am I trying to say?"},{"t":"li","x":"What is my main point?"},{"t":"li","x":"What is getting in the way of saying it?"},{"t":"li","x":"Am I thinking about myself too much?"},{"t":"li","x":"Am I thinking clearly before I speak?"},{"t":"h","x":"Apply it"},{"t":"p","x":"Before your baseline recording, ask:"},{"t":"p","x":"\"If the listener remembers only one thing, what do I want it to be?\""},{"t":"p","x":"That question becomes one of the foundations of the whole six-month programme."}]},{"id":"journey","title":"Your six-month journey","group":"ref","blocks":[{"t":"tbl","rows":[["Stage","Main Question"],["Month 1","Can people understand me easily?"],["Month 2","Can I organise my thoughts while speaking?"],["Month 3","Can I enter a conversation and hold the floor?"],["Month 4","Can I properly understand the person I'm talking to?"],["Month 5","Can I adapt my communication to the person and situation?"],["Month 6","Do people get to know the interesting person behind the information?"]]}]},{"id":"rules","title":"The five rules to carry forward","group":"ref","blocks":[{"t":"ol","n":1,"x":"SAY THE POINT EARLY. Don't make people wait for it."},{"t":"ol","n":2,"x":"ONE THOUGHT. ONE SENTENCE. PAUSE. Shorter is usually easier to understand."},{"t":"ol","n":3,"x":"FINISH. Don't let your voice disappear at the end."},{"t":"ol","n":4,"x":"LISTEN BEFORE SOLVING. Work out what the person actually wants."},{"t":"ol","n":5,"x":"BE INTERESTED, NOT IMPRESSIVE. Ask good questions."},{"t":"p","x":"Listen to the answers."},{"t":"p","x":"Reveal something about yourself."},{"t":"p","x":"Tell the occasional story."},{"t":"p","x":"Have opinions."},{"t":"p","x":"Show emotion."},{"t":"p","x":"That's where the interesting person emerges."}]},{"id":"realworld","title":"The real-world rule","group":"ref","blocks":[{"t":"p","x":"The daily 15–20 minutes is your training."},{"t":"p","x":"Real conversations are your practice ground."},{"t":"p","x":"Use the skill:"},{"t":"li","x":"at work;"},{"t":"li","x":"with your family;"},{"t":"li","x":"at your club;"},{"t":"li","x":"at Toastmasters;"},{"t":"li","x":"with friends;"},{"t":"li","x":"with people you have just met."},{"t":"p","x":"Don't judge every conversation as a performance."},{"t":"p","x":"Instead ask:"},{"t":"p","x":"“Did I deliberately practise the skill?”"},{"t":"p","x":"If yes, the day counts."}]},{"id":"toast","title":"Toastmasters through the programme","group":"ref","blocks":[{"t":"p","x":"You don't need to turn every Toastmasters meeting into another assignment."},{"t":"p","x":"Use it as a laboratory."},{"t":"p","x":"Early months"},{"t":"p","x":"Ask for feedback on:"},{"t":"li","x":"clarity;"},{"t":"li","x":"sentence length;"},{"t":"li","x":"pace;"},{"t":"li","x":"endings;"},{"t":"li","x":"main point."},{"t":"p","x":"Middle months"},{"t":"p","x":"Ask about:"},{"t":"li","x":"structure;"},{"t":"li","x":"confidence;"},{"t":"li","x":"holding attention;"},{"t":"li","x":"handling questions;"},{"t":"li","x":"naturalness."},{"t":"p","x":"Later months"},{"t":"p","x":"Ask about:"},{"t":"li","x":"personality;"},{"t":"li","x":"storytelling;"},{"t":"li","x":"emotional range;"},{"t":"li","x":"humour;"},{"t":"li","x":"genuine interest;"},{"t":"li","x":"memorability."},{"t":"p","x":"A particularly useful question is:"},{"t":"p","x":"“What was the one moment that was most engaging?”"},{"t":"p","x":"And another:"},{"t":"p","x":"“Where did I lose you?”"},{"t":"p","x":"Those answers will tell you much more than simply hearing:"},{"t":"p","x":"“Good speech.”"}]},{"id":"final","title":"Final reminder","group":"ref","blocks":[{"t":"p","x":"You are not trying to become somebody else."},{"t":"p","x":"You already have useful strengths:"},{"t":"p","x":"thoughtfulness, consideration, logic, knowledge and an interest in people."},{"t":"p","x":"The programme is about adding range:"},{"t":"p","x":"clarity + confidence + structure + listening + assertiveness + emotional expression + storytelling + curiosity."},{"t":"p","x":"The ultimate goal is simple:"},{"t":"p","x":"People understand you.\nPeople enjoy talking to you.\nPeople remember something about you."},{"t":"p","x":"And people leave the conversation knowing that there is more to you than just your job."}]},{"id":"g-intro","title":"Goodman companion plan","group":"ref","blocks":[{"t":"p","x":"Chapters:"},{"t":"ol","n":1,"x":"Begin with a Crystal Clear Mind"},{"t":"ol","n":2,"x":"The Art of Preparing Crystal Clear Messages"},{"t":"ol","n":3,"x":"Secrets of Appealing to Any Listener or Reader"},{"t":"ol","n":4,"x":"Special Communication Challenges and Circumstances"},{"t":"ol","n":5,"x":"Staying Positive"},{"t":"ol","n":6,"x":"Script Your Success"},{"t":"p","x":"How to use Crystal Clear Communication alongside the six-month speaking programme Main rule:\nThe six-month programme is your training course.\nGoodman's audiobook is your supporting teacher."},{"t":"p","x":"Don't try to memorise the book. Listen, notice one useful idea, and then put that idea into practice in the day's exercise."}]},{"id":"g-map","title":"The overall map: weeks and Goodman chapters","group":"ref","blocks":[{"t":"tbl","rows":[["Course weeks","Your main skill","Goodman"],["Preparation","Clear your mind","Ch. 1"],["Weeks 1–4","Clear speech / being heard","Ch. 1–2"],["Weeks 5–8","Organise thoughts","Ch. 2–3"],["Weeks 9–12","Meetings / presentations","Ch. 3–4"],["Week 13","Confidence / reset","Ch. 5"],["Weeks 14–17","Listening / conversation","Ch. 3–4"],["Weeks 18–24","Assertiveness / influence / adaptation","Ch. 3–5"],["Weeks 25–26","Stories / personality / integration","Ch. 5–6"]]}]},{"id":"g-listen","title":"How to listen","group":"ref","blocks":[{"t":"p","x":"Don't make the audiobook another course you have to \"complete.\""},{"t":"p","x":"Use this rhythm:"},{"t":"p","x":"2–3 times per week"},{"t":"p","x":"Listen for 15–25 minutes while walking, driving or doing something routine."},{"t":"p","x":"During your daily 15–20-minute workout"},{"t":"p","x":"Do not listen."},{"t":"p","x":"Do the actual speaking exercises."},{"t":"p","x":"When Goodman gives you a useful idea"},{"t":"p","x":"Pause and ask:"},{"t":"p","x":"\"How would I practise that in today's exercise?\""},{"t":"p","x":"Then practise it."},{"t":"h","x":"Keep only one note"},{"t":"p","x":"After each listening session, write:"},{"t":"p","x":"\"Use this:\""},{"t":"p","x":"Then one sentence."},{"t":"p","x":"For example:"},{"t":"p","x":"\"Use this: say the important thing earlier.\""},{"t":"p","x":"That's enough."}]},{"id":"g-key","title":"The most important thing","group":"ref","blocks":[{"t":"p","x":"Don't try to make your six-month programme become a Goodman course."},{"t":"p","x":"The two have different jobs."},{"t":"p","x":"Goodman teaches you:"},{"t":"p","x":"\"How do I formulate and deliver a clearer message?\""},{"t":"p","x":"Our programme teaches you:"},{"t":"p","x":"\"How do I become a clearer, more confident, better listener, more adaptable conversationalist and ultimately a more interesting person to talk to?\""},{"t":"p","x":"That distinction is important."},{"t":"p","x":"Goodman is particularly strong for your Months 1–3 and Month 5. His published material specifically covers clear thinking, message preparation, audience adaptation, stage fright and communication challenges."},{"t":"p","x":"Your programme deliberately goes further in Months 4 and 6, especially around active listening, friendship, self-revelation, emotional communication, storytelling and personality."},{"t":"p","x":"So use Goodman as a parallel audio coach, not as a replacement for the six-month programme."},{"t":"p","x":"One adjustment I'd make to the original course"},{"t":"p","x":"Having now planation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2"},{"t":"p","x":"Goodman emphasises organising thoughts and notes that audiences have limited capacity for retaining multiple points. His published material specifically recommends organising thoughts quickly and keeping to a small number of points."},{"t":"h","x":"Your translation"},{"t":"p","x":"Don't give people seven things."},{"t":"p","x":"Give them:"},{"t":"p","x":"\"There are three things I'd highlight.\""},{"t":"p","x":"Then:"},{"t":"ol","n":1,"x":"First..."},{"t":"ol","n":2,"x":"Second..."},{"t":"ol","n":3,"x":"Third..."},{"t":"p","x":"This is highly relevant to your IT/project-management communication."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Lost Thread"},{"t":"li","x":"Simplify"},{"t":"li","x":"Don't Chase Every Thought"},{"t":"li","x":"Unexpected Question"},{"t":"li","x":"Recovery Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 1 + Chapter 2"},{"t":"p","x":"This is where the \"clear mind\" idea comes back."},{"t":"h","x":"Your Goodman-inspired recovery phrase"},{"t":"p","x":"If you lose your thread:"},{"t":"p","x":"\"Let me go back to the main point.\""},{"t":"p","x":"Then say the main point."},{"t":"p","x":"Do not try to reconstruct every thought you had."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Technical Explanation"},{"t":"li","x":"Senior Manager Version"},{"t":"li","x":"Nontechnical Version"},{"t":"li","x":"12-Year-Old Version"},{"t":"li","x":"Month 2 Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3: Secrets of Appealing to Any Listener or Reader"},{"t":"p","x":"This is a particularly strong match."},{"t":"p","x":"Goodman explicitly teaches sizing up the audience and adapting the message to the listener."},{"t":"h","x":"Your translation"},{"t":"p","x":"Same idea."},{"t":"p","x":"Different listener."},{"t":"p","x":"Technical colleague:\nMore detail."},{"t":"p","x":"Senior manager:\nOutcome, risk, decision."},{"t":"p","x":"Nontechnical person:\nPlain English."},{"t": g emotion to derail the message."},{"t":"h","x":"Your translation"},{"t":"p","x":"When interrupted:"},{"t":"p","x":"\"Let me finish this point.\""},{"t":"p","x":"Then continue."},{"t":"p","x":"When challenged:"},{"t":"p","x":"\"I see the concern. My view is...\""},{"t":"p","x":"When you don't know:"},{"t":"p","x":"\"I don't know yet. I'll check that.\""},{"t":"p","x":"The goal is calm clarity, not winning."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Three-Part Structure"},{"t":"li","x":"Opening"},{"t":"li","x":"Six-Word Notes"},{"t":"li","x":"Unexpected Question"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 6"},{"t":"h","x":"Your focus"},{"t":"p","x":"Start moving from:"},{"t":"p","x":"prepared speech"},{"t":"p","x":"towards:"},{"t":"p","x":"prepared thinking."},{"t":"p","x":"Your six-word notes should give you enough structure to speak without reading."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Light Review"},{"t":"li","x":"One-Minute Story"},{"t":"li","x":"One Opinion"},{"t":"li","x":"Year in Three Points"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 5: Staying Positive"},{"t":"h","x":"Use this chapter differently"},{"t":"p","x":"Don't treat it as motivational listening."},{"t":"p","x":"Use it to examine your relationship with speaking."},{"t":"p","x":"Ask:"},{"t":"p","x":"\"Am I trying to avoid looking foolish?\""},{"t":"p","x":"\"Am I trying to sound perfect?\""},{"t":"p","x":"\"Am I allowing nerves to make me rush?\""},{"t":"p","x":"The purpose is to reduce self-monitoring and put attention back on the listener."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Facts and Point"},{"t":"li","x":"The Question"},{"t":"li","x":"The Concern"},{"t":"li","x":"The Need"},{"t":"li","x":"Reflect Back"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3"},{"t":"p","x":"This is where your programme deliberately goes beyond Goodman."},{"t":"p","x":"Goodman gives you useful audience-awareness principles."},{"t":"p","x":"Your course adds the deeper listening sequence:"},{"t":"p","x":"Facts → Point → Question → Concern → Need → Emotion"},{"t":"h","x":"Important"},{"t":"p","x":"Don't merely ask:"},{"t":"p","x":"\"What did they say?\""},{"t":"p","x":"Ask:"},{"t":"p","x":"\"What are they really trying to get from me?\""}],[{"t":"h","x":"Your training"},{"t":"li","x":"Open Questions"},{"t":"li","x":"Follow-Up"},{"t":"li","x":"Interesting Detail"},{"t":"li","x":"Don't Interview"},{"t":"li","x":"Conversation Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3"},{"t":"p","x":"Goodman talks about appealing to listeners."},{"t":"p","x":"Your programme turns that into a social skill:"},{"t":"p","x":"Make the other person interesting to you."},{"t":"p","x":"Don't use communication techniques merely to make yourself sound good."},{"t":"p","x":"Use them to become genuinely curious."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Small Personal Detail"},{"t":"li","x":"Story Fragment"},{"t":"li","x":"Shared Connection"},{"t":"li","x":"Joining a Group"},{"t":"li","x":"Ask → Reveal → Follow"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5 This is another point where your programme deliberately goes beyond the book."},{"t":"p","x":"Goodman can help with listener awareness."},{"t":"p","x":"But friendship-building requires you to reveal something about yourself."},{"t":"h","x":"Your target:"},{"t":"p","x":"Ask → reveal → follow."},{"t":"p","x":"Not:"},{"t":"p","x":"Ask → ask → ask → ask."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Information"},{"t":"li","x":"Reassurance"},{"t":"li","x":"Empathy"},{"t":"li","x":"Problem-Solving"},{"t":"li","x":"Adaptive Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4"},{"t":"p","x":"This is one of the most useful combinations."},{"t":"p","x":"Before responding, identify what the person needs."},{"t":"p","x":"Do they need:"},{"t":"li","x":"information?"},{"t":"li","x":"reassurance?"},{"t":"li","x":"empathy?"},{"t":"li","x":"a solution?"},{"t":"li","x":"motivation?"},{"t":"h","x":"Your key question"},{"t":"p","x":"\"What kind of response does this person need from me?\""}],[{"t":"h","x":"Your training"},{"t":"li","x":"State a Preference"},{"t":"li","x":"Say No"},{"t":"li","x":"State Your View"},{"t":"li","x":"Disagree"},{"t":"li","x":"Assertiveness Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 5"},{"t":"h","x":"Your focus"},{"t":"p","x":"Goodman's confidence material is useful here, but don't confuse confidence with forcefulness."},{"t":"p","x":"Your target is:"},{"t":"p","x":"Clear + calm + respectful."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Technical Person"},{"t":"li","x":"Senior Person"},{"t":"li","x":"Concerned Person"},{"t":"li","x":"Busy Person"},{"t":"li","x":"Five Versions"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 — highest priority This is probably the second strongest overlap between Goodman and your course."},{"t":"p","x":"Goodman explicitly emphasises sizing up the audience and adapting communication to the listener."},{"t":"h","x":"Your exercise"},{"t":"p","x":"Take one message:"},{"t":"p","x":"\"We need to delay the project by two weeks.\""},{"t":"p","x":"Say it five ways."},{"t":"p","x":"The facts stay the same."},{"t":"p","x":"The communication changes."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Problem"},{"t":"li","x":"Consequence"},{"t":"li","x":"Solution"},{"t":"li","x":"Benefit"},{"t":"li","x":"Two-Minute Pitch"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4"},{"t":"h","x":"Caution"},{"t":"p","x":"This is where Goodman's sales orientation becomes particularly noticeable."},{"t":"p","x":"His programme explicitly includes techniques for selling a product, service or idea."},{"t":"p","x":"Use the underlying communication principle, not necessarily the sales language."},{"t":"h","x":"Your version:"},{"t":"p","x":"Problem → consequence → solution → benefit"},{"t":"p","x":"That is useful for persuading managers, colleagues and stakeholders."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Name the Emotion"},{"t":"li","x":"Validate"},{"t":"li","x":"Don't Solve Too Quickly"},{"t":"li","x":"Encourage"},{"t":"li","x":"Emotional Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5"},{"t":"h","x":"But make this your own"},{"t":"p","x":"Goodman is not the main teacher for emotional intelligence here."},{"t":"p","x":"Your six-month course deliberately goes further."},{"t":"p","x":"The target is:"},{"t":"p","x":"Understand first. Solve second."},{"t":"p","x":"That will be particularly important in family and friendship conversations."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Behaviour"},{"t":"li","x":"Impact"},{"t":"li","x":"Request"},{"t":"li","x":"Receiving Criticism"},{"t":"li","x":"Difficult Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 5 Your Goodman connection"},{"t":"p","x":"Use the \"clear message\" principle."},{"t":"p","x":"Don't bury the message inside five minutes of explanation."},{"t":"p","x":"Instead:"},{"t":"p","x":"Behaviour → Impact → Request"},{"t":"p","x":"Example:"},{"t":"p","x":"\"When the information comes late, it affects the project timeline. I need you to give me two days' notice.\""},{"t":"p","x":"Clear."},{"t":"p","x":"Specific."},{"t":"p","x":"Respectful."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Ask First"},{"t":"li","x":"Purpose"},{"t":"li","x":"Autonomy"},{"t":"li","x":"Support"},{"t":"li","x":"Motivation Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5"},{"t":"h","x":"Listen for"},{"t":"p","x":"How the listener's perspective changes the effectiveness of your message."},{"t":"h","x":"Your adaptation"},{"t":"p","x":"Instead of:"},{"t":"p","x":"\"Here's what you need to do.\""},{"t":"p","x":"Try:"},{"t":"p","x":"\"What do you think would work?\""},{"t":"p","x":"Then:"},{"t":"p","x":"\"What would help you get there?\""},{"t":"p","x":"This is where your natural Green side becomes an asset while you practise greater directness."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Green"},{"t":"li","x":"Blue"},{"t":"li","x":"Direct"},{"t":"li","x":"Persuasive"},{"t":"li","x":"Adaptive Challenge"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4 + Chapter 6"},{"t":"p","x":"This is your synthesis week."},{"t":"p","x":"Think:"},{"t":"p","x":"Who am I talking to?"},{"t":"p","x":"What do they need?"},{"t":"p","x":"What is my point?"},{"t":"p","x":"How should I express it?"},{"t":"p","x":"What response do I want?"},{"t":"p","x":"That's essentially the Goodman principle translated into your broader communication programme."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Story Structure"},{"t":"li","x":"Concrete Detail"},{"t":"li","x":"Emotion"},{"t":"li","x":"Opinions"},{"t":"li","x":"Personality"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 6: Script Your Success"},{"t":"h","x":"Important distinction"},{"t":"p","x":"This is where Goodman becomes a supporting resource rather than the main teacher."},{"t":"p","x":"Your goal now isn't simply:"},{"t":"p","x":"\"Can I communicate clearly?\""},{"t":"p","x":"It's:"},{"t":"p","x":"\"Do people enjoy listening to me?\""},{"t":"p","x":"That's a bigger question."},{"t":"p","x":"Goodman helps with preparation and deliberate practice."},{"t":"p","x":"Your course now adds:"},{"t":"li","x":"stories"},{"t":"li","x":"opinions"},{"t":"li","x":"concrete details"},{"t":"li","x":"emotion"},{"t":"li","x":"personality"},{"t":"li","x":"self-revelation"},{"t":"p","x":"These are what help you move towards your ambition:"},{"t":"p","x":"\"That man is interesting.\""}],[{"t":"p","x":"Goodman: Chapter 3"},{"t":"p","x":"Your focus:\nListen more than you speak."},{"t":"p","x":"Find something genuinely interesting about another person."}],[{"t":"p","x":"Goodman: Chapter 5 + Chapter 6"},{"t":"p","x":"Don't try to be perfect."},{"t":"p","x":"Use what you've practised:"},{"t":"p","x":"Point → Reason → Example → Story → Opinion"},{"t":"p","x":"Stay relaxed."},{"t":"p","x":"Recover if you lose your thread."},{"t":"p","x":"Finish clearly."}],[{"t":"p","x":"Goodman: Revisit the ideas that proved most useful."},{"t":"p","x":"Don't try to listen to the whole book again."},{"t":"p","x":"Instead, ask:"},{"t":"p","x":"What did Goodman give me?"},{"t":"ol","n":1,"x":"Clear mind"},{"t":"p","x":"Before speaking, know what you want to say."},{"t":"ol","n":2,"x":"Clear message"},{"t":"p","x":"Don't bury the point."},{"t":"ol","n":3,"x":"Listener awareness"},{"t":"p","x":"Shape the message for the person hearing it."},{"t":"ol","n":4,"x":"Practice"},{"t":"p","x":"Don't wait until you're confident before communicating."},{"t":"ol","n":5,"x":"Audience attention"},{"t":"p","x":"Give people a reason to listen."},{"t":"ol","n":6,"x":"Deliberate preparation"},{"t":"p","x":"Prepare the thinking, not just the words."}]]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),days={},pages={};
D.days.forEach(d=>days[d.date]=d);D.pages.forEach(p=>pages[p.id]=p);
const LS='comm-programme-v1';let S={done:{},notes:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const TODAY=key(new Date()),START=new Date(2026,9,1),END=new Date(2027,2,31);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),f=s=>esc(s).replace(/\n/g,'<br>');
function B(bs){let h='';for(let i=0;i<bs.length;){const b=bs[i];
 if(b.t==='li'||b.t==='ol'){const t=b.t,g=t==='li'?'ul':'ol';h+=`<${g}>`;for(;i<bs.length&&bs[i].t===t;i++)h+=`<li${t==='ol'?` value="${bs[i].n}"`:''}>${f(bs[i].x)}</li>`;h+=`</${g}>`;continue}
 if(b.t==='h')h+=`<h4>${f(b.x)}</h4>`;
 else if(b.t==='q')h+=`<blockquote>${f(b.x)}</blockquote>`;
 else if(b.t==='tbl')h+='<div class="tw"><table>'+b.rows.map((r,j)=>'<tr>'+r.map(c=>`<${j?'td':'th'}>${f(c)}</${j?'td':'th'}>`).join('')+'</tr>').join('')+'</table></div>';
 else h+=`<p${b.ind?' class="ind"':''}>${f(b.x)}</p>`;i++}return h}
const cnt=d=>{const n=d.tasks.length;let c=0;for(let i=0;i<n;i++)if(S.done[d.date+':'+i])c++;return[c,n]};
let vy,vm;
{const t=new Date(),s=t<START?START:t>END?END:t;vy=s.getFullYear();vm=s.getMonth()}
function grid(){
 const first=new Date(vy,vm,1),off=(first.getDay()+6)%7,n=new Date(vy,vm+1,0).getDate(),rows=Math.ceil((off+n)/7);
 $('grid').style.gridTemplateRows=`repeat(${rows},1fr)`;let h='';
 for(let i=0;i<rows*7;i++){const dn=i-off+1;
  if(dn<1||dn>n){h+='<div class="c x"></div>';continue}
  const dt=new Date(vy,vm,dn),k=key(dt),d=days[k],inr=dt>=START&&dt<=END,wk=dt.getDay()%6===0;
  if(!inr){h+=`<div class="c o"><span class="n">${dn}</span></div>`;continue}
  let cl='c'+(k===TODAY?' today':'')+(wk?' wk':'')+(S.notes[k]?' note':''),inner=`<span class="n">${dn}</span>`,bar='';
  if(d){const[c,t]=cnt(d);
   if(t&&c===t)cl+=' done';else if(t&&c)bar=`<i class="bar" style="--p:${c/t*100}%"></i>`;
   inner+=`<span class="l">${d.kind==='day'?'Day '+d.n:d.kind==='prep'?'Prep '+d.n:'Rest'}</span><span class="t">${esc(d.title)}</span>`}
  else inner+='<span class="r">Rest / optional practice</span>';
  h+=`<button class="${cl}" data-k="${k}" aria-label="${dt.toDateString()}${d?': '+d.title:''}">${inner}${bar}</button>`}
 $('grid').innerHTML=h;
 $('mt').textContent=first.toLocaleDateString('en-IE',{month:'long',year:'numeric'});
 $('pv').disabled=vy===2026&&vm===9;$('nx').disabled=vy===2027&&vm===2;
 const dd=D.days.filter(d=>d.kind==='day'&&cnt(d)[0]===d.tasks.length&&d.tasks.length).length;
 $('prog').textContent=`${dd} of 126 days complete`}
let cur=null,tmr;
function show(html,ctx){$('panel').innerHTML=html;$('panel').hidden=$('bk').hidden=false;cur=ctx;$('panel').querySelector('.pb').scrollTop=0;$('panel').querySelector('.ph button').focus()}
function close(){$('panel').hidden=$('bk').hidden=true;cur=null;grid()}
const head=(s,t,m)=>`<div class="ph"><div><div class="s">${esc(s)}</div><h2>${esc(t)}</h2>${m?`<div class="m">${esc(m)}</div>`:''}</div><button aria-label="Close" data-close>✕</button></div>`;
const task=(t,i,id,done)=>`<section class="tk${done?' done':' open'}" data-id="${id}"><header><span class="tt">${esc(t.title)}</span>${t.mins?`<span class="tm">${t.mins}</span>`:''}<button class="ck" data-ck>${done?'Done ✓':'Mark done'}</button><span class="cv">▾</span></header><div class="tb">${B(t.blocks)}</div></section>`;
const note=(k,label)=>`<div class="nt"><label for="nt">${label}</label><textarea id="nt" placeholder="How did it go? What did you notice? What will you do differently?">${esc(S.notes[k]||'')}</textarea><small id="sv"></small></div>`;
function openDay(k){
 const dt=parse(k),d=days[k],long=dt.toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 if(!d){show(head(long,'Rest / optional real-world practice')+`<div class="pb"><p>Weekends: Rest / optional real-world practice.</p>${note(k,'Note (optional)')}</div>`,{k,note:k});return}
 const m=d.kind==='prep'?'Preparation':`Month ${d.month} · ${d.monthName}${d.week?` · Week ${d.week} — ${d.weekName}`:` · ${d.weekName}`}`;
 const[c,n]=cnt(d);
 let h=head(long,d.kind==='rest'?'Rest day — '+d.title:`${d.label} — ${d.title}`,m)+'<div class="pb">';
 if(n)h+=`<div class="prg" id="prg">${c} of ${n} tasks done</div>`;
 if(d.weekIntro&&d.weekIntro.length)h+=`<details class="gd"><summary>This week's focus</summary>${B(d.weekIntro)}</details>`;
 if(d.intro.length)h+=`<div class="intro">${B(d.intro)}</div>`;
 d.tasks.forEach((t,i)=>h+=task(t,i,k+':'+i,S.done[k+':'+i]));
 if(d.g!=null)h+=`<details class="gd"><summary>Goodman audiobook — this week</summary>${B(D.good[d.g])}</details>`;
 h+=note(k,'End-of-day note')+'</div>';show(h,{k,note:k,day:d})}
function openPage(id){
 const p=pages[id];let h=head(p.group==='ref'?'Reference':'Preparation & Baseline',p.title)+'<div class="pb">'+B(p.blocks);
 (p.tasks||[]).forEach((t,i)=>h+=task(t,i,'page:'+id+':'+i,S.done['page:'+id+':'+i]));
 if(p.tasks)h+=note('page:'+id,'Notes');show(h+'</div>',{note:p.tasks?'page:'+id:null})}
$('panel').addEventListener('click',e=>{
 if(e.target.closest('[data-close]'))return close();
 const tk=e.target.closest('.tk');if(!tk)return;
 if(e.target.closest('[data-ck]')){const id=tk.dataset.id,on=!S.done[id];on?S.done[id]=1:delete S.done[id];save();
  tk.classList.toggle('done',on);tk.classList.toggle('open',!on);e.target.textContent=on?'Done ✓':'Mark done';
  if(cur&&cur.day){const[c,n]=cnt(cur.day);$('prg').textContent=c===n?`All ${n} tasks done — add a note below.`:`${c} of ${n} tasks done`}
  grid();return}
 if(e.target.closest('header'))tk.classList.toggle('open')});
$('panel').addEventListener('input',e=>{if(e.target.id!=='nt'||!cur||!cur.note)return;
 const v=e.target.value,k=cur.note;v.trim()?S.notes[k]=v:delete S.notes[k];$('sv').textContent='Saving…';
 clearTimeout(tmr);tmr=setTimeout(()=>{save();$('sv').textContent='Saved';grid()},400)});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)openDay(b.dataset.k)});
$('bk').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').hidden)close()});
$('pv').onclick=()=>{vm--;if(vm<0){vm=11;vy--}grid()};$('nx').onclick=()=>{vm++;if(vm>11){vm=0;vy++}grid()};
$('td').onclick=()=>{const t=new Date();if(t<START||t>END){vy=2026;vm=9}else{vy=t.getFullYear();vm=t.getMonth()}grid();if(t>=START&&t<=END)openDay(TODAY)};
const pl=(label,attr)=>`<button class="pill" ${attr}>${label}</button>`;
$('prepl').innerHTML=pl('Start here','data-p="start"')+pl('Preparation Day 1','data-d="2026-10-01"')+pl('Preparation Day 2','data-d="2026-10-02"')+pl('Baseline','data-p="baseline"')+pl('Goodman: Intro + Ch. 1','data-p="g-prep"');
$('refm').innerHTML=D.pages.filter(p=>p.group==='ref').map(p=>`<button data-p="${p.id}">${esc(p.title)}</button>`).join('');
document.querySelector('footer').addEventListener('click',e=>{const b=e.target.closest('[data-p],[data-d]');if(!b)return;$('ref').open=false;b.dataset.p?openPage(b.dataset.p):openDay(b.dataset.d)});
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='communication-programme-backup.json';a.click()};
$('im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S={done:o.done||{},notes:o.notes||{}};save();grid();alert('Backup restored.')}catch(x){alert('That file could not be read.')}};if(e.target.files[0])r.readAsText(e.target.files[0])};
grid();
</script>
